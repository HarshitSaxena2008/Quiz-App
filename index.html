<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="8uFIXW8Q2zLFDcA9RrQA5yOwcTGrCSAkz0RFeSuO21I" />
    <title>Quiz Brain Teasor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1 class="head">⭐!! Quiz Arena !!⭐</h1>
    <div class="game">
        <button class="start-msg">Start Challenge😎?</button>
        <div class="content hide">
            <div class="Question-count">Question :</div>
            <div class="question"></div>
            <div class="options">
                <ul>
                    <li class="choice" id="A"></li>
                    <li class="choice" id="B"></li>
                    <li class="choice" id="C"></li>
                    <li class="choice" id="D"></li>
                </ul>
            </div>
            <div class="result">
                <button class="reset">Reset</button>
                <div class="msg">None</div>
                <button class="next">Next</button>
            </div>
        </div>
        <div class="winner hide">
            <div class="win-msg"></div>
            <button class="Retry">Retry</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
